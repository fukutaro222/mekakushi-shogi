        ['かくぎょう','bishop',false],['角行','bishop',false],['かく','bishop',false],['角','bishop',false],
        // 金
        ['きんしょう','gold',false],['金将','gold',false],['きん','gold',false],['金','gold',false],
        // 銀
        ['ぎんしょう','silver',false],['銀将','silver',false],['ぎん','silver',false],['銀','silver',false],
        // 桂
        ['けいま','knight',false],['桂馬','knight',false],['けい','knight',false],['桂','knight',false],
        // 香
        ['きょうしゃ','lance',false],['香車','lance',false],['きょう','lance',false],['香','lance',false],
        // 王・玉
        ['おうしょう','king',false],['ぎょくしょう','king',false],
        ['王将','king',false],['玉将','king',false],
        ['おう','king',false],['ぎょく','king',false],['たま','king',false],
        ['王','king',false],['玉','king',false],
        // 歩（最後: 'ふ' は短くて数字「ふたつ」と競合するため）
        ['ふみん','pawn',false],['ふみ','pawn',false],
        ['歩兵','pawn',false],['歩','pawn',false],['ふ','pawn',false],
    ];

    // 「同」の読み（長いものを先に）
    const DOU_READINGS = ['どうじょ','どう','同'];

    // 方向修飾子の読み（長いものを先に）
    const DIR_READINGS = [
        ['ひだり','left'],['左','left'],
        ['みぎ','right'],['右','right'],
        ['なおし','straight'],['ちょく','straight'],['すぐ','straight'],['直','straight'],
        ['あがる','up'],['上','up'],
        ['ひく','down'],['引','down'],
        ['より','lateral'],['寄','lateral'],
    ];

    // 方向→表示漢字
    const DIR_KANJI = { right:'右', left:'左', straight:'直', up:'上', down:'引', lateral:'寄' };

    let micActive    = false;
    let recognition  = null;
    let lastVoiceText = '';   // 最後に認識されたテキスト（interim含む）
    let moveExecuted  = false; // 1回の発話で二重実行を防ぐフラグ

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
        recognition = new SpeechRec();
        recognition.lang = 'ja-JP';
        recognition.continuous    = false; // 発話後すぐ確定させる
        recognition.interimResults = true;

        recognition.onresult = (event) => {
            let interim = '', final = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const t = event.results[i][0].transcript;
                console.log(`[Voice] result[${i}] isFinal=${event.results[i].isFinal} "${t}"`);
                if (event.results[i].isFinal) final += t; else interim += t;
            }
            const display = final || interim;
            lastVoiceText = display;
            setVoiceText(display, !final);

            // isFinal が来たらすぐ処理
            if (final) tryVoiceMove(final);
        };

        recognition.onerror = (event) => {
            console.log('[Voice] error:', event.error);
            if (event.error !== 'no-speech') setVoiceText(`エラー: ${event.error}`, false);
            if (event.error === 'not-allowed') setVoiceText('マイクの使用が許可されていません', false);
            micActive = false;
            updateMicBtn();
        };

        // continuous=false でボタンを押し続けている間は onend で再起動
        recognition.onend = () => {
            console.log('[Voice] onend micActive=', micActive);
            if (micActive) {
                try { recognition.start(); }
                catch(e) { micActive = false; updateMicBtn(); }
            } else {
                updateMicBtn();
            }
        };
    }

    function startListening() {
        if (!recognition) { setVoiceText('このブラウザは音声認識に未対応です', false); return; }
        if (micActive) return;
        micActive     = true;
        moveExecuted  = false;
        lastVoiceText = '';
        updateMicBtn();
        setVoiceText('認識中…', true);
        try { recognition.start(); }
        catch(e) { console.log('[Voice] start error', e); micActive = false; updateMicBtn(); }
    }

    function stopListening() {
        micActive = false;
        try { recognition?.stop(); } catch(e) {}
        updateMicBtn();

        // isFinal が来なかった場合のフォールバック: ボタンを離したときに最後のテキストを処理
        const fallback = lastVoiceText;
        setTimeout(() => {
            if (!moveExecuted && fallback) {
                console.log('[Voice] fallback on button release:', fallback);
                tryVoiceMove(fallback);
            }
        }, 250);
    }

    function updateMicBtn() {
        document.getElementById('mic-btn')?.classList.toggle('active', micActive);
    }

    function setVoiceText(text, isInterim) {
        const el = document.getElementById('voice-text');
        if (!el) return;
        el.textContent   = text;
        el.style.opacity = isInterim ? '0.5' : '1';
    }

    // テキストを数字トークンと駒トークンに分解する
    // 各位置でまず数字を試み（長優先）、次に駒を試みる
    function tokenizeVoice(text) {
        const tokens = [];
        let pos = 0;
        while (pos < text.length) {
            let hit = false;
            // 「同」チェック（最優先）
            for (const rd of DOU_READINGS) {
                if (text.startsWith(rd, pos)) {
                    tokens.push({ type: 'dou' });
                    pos += rd.length; hit = true; break;
                }
            }
            // 方向修飾子
            if (!hit) {
                for (const [rd, dir] of DIR_READINGS) {
                    if (text.startsWith(rd, pos)) {
                        tokens.push({ type: 'dir', dir });
                        pos += rd.length; hit = true; break;
                    }
                }
            }
            // 数字
            if (!hit) {
                for (const [rd, val] of NUM_READINGS) {
                    if (text.startsWith(rd, pos)) {
                        tokens.push({ type: 'num', value: val });
                        pos += rd.length; hit = true; break;
                    }
                }
            }
            // 駒
            if (!hit) {
                for (const [rd, baseType, isPromoted] of PIECE_READINGS) {
                    if (text.startsWith(rd, pos)) {
                        tokens.push({ type: 'piece', baseType, isPromoted });
                        pos += rd.length; hit = true; break;
                    }
                }
            }
            if (!hit) pos++; // 未知文字はスキップ
        }
        return tokens;
    }

    // 音声/テキストを解析して指し手データを返す
    function parseVoiceMove(rawText) {
        const text = rawText.replace(/\s/g, '');
        console.log('[Voice] parseVoiceMove:', rawText, '→', text);

        const forcePromote = /なり|成り?/.test(text);
        const isDrop       = /うち|打/.test(text);

        const tokens = tokenizeVoice(text);
        console.log('[Voice] tokens:', JSON.stringify(tokens));

        const hasDou = tokens.some(t => t.type === 'dou');
        const dirTok = tokens.find(t => t.type === 'dir');
        const dir    = dirTok?.dir ?? null;
        const nums   = tokens.filter(t => t.type === 'num');
        const pieces = tokens.filter(t => t.type === 'piece');

        let c, r;
        if (hasDou) {
            if (!lastMoveDest) {
                console.log('[Voice] 「同」: 前の移動先が不明');
                return null;
            }
            r = lastMoveDest.r;
            c = lastMoveDest.c;
        } else {
            if (nums.length < 2) {
                console.log('[Voice] 数字が不足:', nums);
                return null;
            }
            const col = nums[0].value;
            const row = nums[1].value;
            c = 9 - col;
            r = row - 1;
            if (c < 0 || c > 8 || r < 0 || r > 8) return null;
        }

        const piece     = pieces[0] ?? null;
        const shogiCol  = 9 - c;
        const rowKanji  = ROW_KANJI[r];
        const pieceKanj = piece
            ? (piece.isPromoted
                ? (KANJI['p_' + piece.baseType] ?? KANJI[piece.baseType] ?? '')
                : (KANJI[piece.baseType] ?? ''))
            : '';
        const dirKanj   = dir ? (DIR_KANJI[dir] ?? '') : '';
        const displayText = hasDou
            ? `同${pieceKanj}${dirKanj}`
            : `${shogiCol}${rowKanji}${pieceKanj}`;

        const result = {
            c, r, dir,
            baseType:    piece?.baseType  ?? null,
            isPromoted:  piece?.isPromoted ?? false,
            forcePromote, isDrop,
            displayText,
        };
        console.log('[Voice] parsed:', result);
        return result;
    }

    // 方向修飾子が発生元の位置に合っているか
    function matchesDirection(fr, fc, toR, toC, dir) {
        switch (dir) {
            case 'right':    return fc > toC;   // 先手から見て右（配列列が大きい）
            case 'left':     return fc < toC;
            case 'straight': return fc === toC;
            case 'up':       return fr > toR;   // 後ろから前進
            case 'down':     return fr < toR;   // 前から後退
            case 'lateral':  return fr === toR;
            default: return true;
        }
    }

    // 解析結果をもとに現在プレイヤーの合法手を探して実行
    // 成功時: { fromR, fromC } (board move) または { isDrop: true } を返す。失敗時: null
    function findAndExecuteVoiceMove({ c, r, dir, baseType, isPromoted, isDrop, forcePromote }) {
        console.log('[Voice] findAndExecute:', { c, r, dir, baseType, isPromoted, isDrop });
        if (r < 0 || r > 8 || c < 0 || c > 8) return null;
        const activeHand = currentTurn === 'sente' ? senteHand : goteHand;

        // 「打」明示
        if (isDrop) {
            if (!baseType || (activeHand[baseType] ?? 0) <= 0) return null;
            const dm = getDropMoves(baseType, currentTurn);
            if (!dm.some(([dr,dc]) => dr===r && dc===c)) return null;
            board[r][c] = { type: baseType, player: currentTurn, promoted: false };
            const wouldCheck = isInCheck(currentTurn);
            board[r][c] = null;
            if (wouldCheck) return null;
            executeDrop(baseType, r, c);
            return { isDrop: true };
        }

        // 盤上の候補を集める（王手を残す手は除外）
        const cands = [];
        for (let fr = 0; fr < 9; fr++) {
            for (let fc = 0; fc < 9; fc++) {
                const p = board[fr][fc];
                if (!p || p.player !== currentTurn) continue;
                if (baseType && p.type !== baseType) continue;
                if (baseType && p.promoted !== isPromoted) continue;
                if (getLegalMovesStrict(fr, fc).some(([mr,mc]) => mr===r && mc===c)) {
                    cands.push({ fr, fc });
                }
            }
        }
        console.log('[Voice] candidates:', cands);

        const filtered = dir
            ? cands.filter(({ fr, fc }) => matchesDirection(fr, fc, r, c, dir))
            : cands;
        console.log('[Voice] filtered by dir:', filtered);

        if (filtered.length === 1) {
            const { fr, fc } = filtered[0];
            executeMove(fr, fc, r, c, forcePromote);
            return { fromR: fr, fromC: fc };
        }
        if (filtered.length > 1) {
            if (baseType) { console.log('[Voice] 曖昧: 複数候補'); return null; }
            const { fr, fc } = filtered[0];
            executeMove(fr, fc, r, c, forcePromote);
            return { fromR: fr, fromC: fc };
        }

        // 持ち駒からの暗黙の打ち
        if (!dir && baseType && !isPromoted && (activeHand[baseType] ?? 0) > 0) {
            const dm = getDropMoves(baseType, currentTurn);
            if (dm.some(([dr,dc]) => dr===r && dc===c)) {
                board[r][c] = { type: baseType, player: currentTurn, promoted: false };
                const wouldCheck = isInCheck(currentTurn);
                board[r][c] = null;
                if (!wouldCheck) { executeDrop(baseType, r, c); return { isDrop: true }; }
            }
        }

        console.log('[Voice] 合法手なし');
        return null;
    }

    // 音声/手動入力の共通処理
    function tryVoiceMove(text) {
        if (moveExecuted) return;
        const me = myActiveRole();
        if (gameOver || currentTurn !== me || computerThinking) {
            setVoiceText('あなたの手番ではありません', false);
            return;
        }
        console.log('[Voice] tryVoiceMove:', text);
        const parsed = parseVoiceMove(text);
        if (!parsed) {
            setVoiceText(`"${text.trim()}" — 解析できません`, false);
            return;
        }
        const result = findAndExecuteVoiceMove(parsed);
        if (result) {
            moveExecuted = true;
            stopListening();
            setVoiceText(`${parsed.displayText} ✓`, false);
            recordMove(parsed.isDrop ? 'drop' : 'board', parsed.r, parsed.c);
            if (pvpMode) {
                if (result.isDrop) {
                    pvpSend({ type:'move', kind:'drop', player:me, pieceType:parsed.baseType, toR:parsed.r, toC:parsed.c });
                } else {
                    pvpSend({ type:'move', kind:'board', player:me, fromR:result.fromR, fromC:result.fromC, toR:parsed.r, toC:parsed.c, promote: board[parsed.r][parsed.c].promoted });
                }
            }
            const postResult = checkPostMove(me);
            const opp = me === 'sente' ? 'gote' : 'sente';
            if (postResult.checkmate) {
                speak(`${postResult.winnerName}の勝ちです`);
                currentTurn = opp;
                renderAll();
                return;
            }
            const moveTxt = blindMode
                ? (() => { const p = board[parsed.r][parsed.c]; return `${9 - parsed.c}${ROW_KANJI[parsed.r]}${pieceKanji(p)}に移動しました`; })()
                : '';
            if (postResult.check) speak(moveTxt ? moveTxt + '。王手！' : '王手！');
            else if (moveTxt) speak(moveTxt);
            currentTurn = opp;
            renderAll();
            if (!pvpMode) triggerComputerMove();
        } else {
            setVoiceText(`${text.trim()} — 合法手なし`, false);
        }
    }

    // ── 起動 ──────────────────────────────────────────────────────────────────
    initBoard();
    renderLabels();
    renderAll();

    // マイクボタンのイベント（PC: mousedown/up、スマホ: touchstart/end）
    const micBtn = document.getElementById('mic-btn');
    if (micBtn) {
        micBtn.addEventListener('mousedown',  (e) => { e.preventDefault(); startListening(); });
        micBtn.addEventListener('mouseup',    stopListening);
        micBtn.addEventListener('mouseleave', stopListening);
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startListening(); }, { passive: false });
        micBtn.addEventListener('touchend',   stopListening);
        micBtn.addEventListener('touchcancel',stopListening);
    }

    // 手動テキスト入力のイベント
    const voiceInputEl  = document.getElementById('voice-input');
    const voiceInputBtn = document.getElementById('voice-input-btn');
    const submitManual  = () => {
        const text = voiceInputEl?.value.trim();
        if (!text) return;
        moveExecuted = false;
        lastVoiceText = text;
        setVoiceText(text, false);
        tryVoiceMove(text);
        voiceInputEl.value = '';
    };
    voiceInputBtn?.addEventListener('click', submitManual);
    voiceInputEl?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) submitManual(); });

    // 目隠しモードトグル
    const blindToggleBtn = document.getElementById('blind-toggle');
    const voiceLabelEl   = document.getElementById('voice-label');
    const VOICE_LABEL_NORMAL = 'ボタンを押しながら読み上げ（例：７六歩、２六飛）';
    const VOICE_LABEL_BLIND  = '【目隠し中】音声または入力で指し手を入力（例：７六歩）';

    // 「もう一度」ボタン
    document.getElementById('replay-btn')?.addEventListener('click', () => {
        document.getElementById('gameover-overlay').style.display = 'none';
        if (pvpMode) pvpSend({ type: 'reset' });
        initBoard(); renderLabels(); renderAll();
    });

    // 投了ボタン
    document.getElementById('resign-btn')?.addEventListener('click', onResign);

    // 時計トグル
    document.getElementById('clock-toggle-btn')?.addEventListener('click', toggleClock);

    // 対人戦ボタン
    document.getElementById('pvp-btn')?.addEventListener('click', () => {
        if (pvpMode) { pvpStop(); return; }
        pvpCreateRoom();
    });

    // URLコピーボタン
    document.getElementById('pvp-copy-btn')?.addEventListener('click', () => {
        const url = document.getElementById('pvp-url')?.textContent;
        if (!url) return;
        navigator.clipboard.writeText(url).then(() => {
            const btn = document.getElementById('pvp-copy-btn');
            const orig = btn.textContent;
            btn.textContent = 'コピーしました！';
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }).catch(() => {
            // clipboard API が使えない場合の fallback
            const inp = document.createElement('input');
            inp.value = url; document.body.appendChild(inp);
            inp.select(); document.execCommand('copy');
            document.body.removeChild(inp);
        });
    });

    // キャンセルボタン
    document.getElementById('pvp-cancel-btn')?.addEventListener('click', pvpStop);

    // URLに ?room= パラメータがあれば自動参加（ゲストとして入室）
    const roomParam = new URLSearchParams(location.search).get('room');
    if (roomParam) {
        pvpJoinRoom(roomParam);
    }

    // CPUレベル選択
    document.querySelectorAll('.lv-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            cpuLevel = parseInt(btn.dataset.lv, 10);
            document.querySelectorAll('.lv-btn').forEach(b =>
                b.classList.toggle('active', b === btn));
        });
    });

    if (blindToggleBtn) {
        blindToggleBtn.addEventListener('click', () => {
            blindMode = !blindMode;
            selected = null; legalMoves = [];
            blindToggleBtn.textContent = `目隠しモード ${blindMode ? 'ON' : 'OFF'}`;
            blindToggleBtn.classList.toggle('blind-on', blindMode);
            if (voiceLabelEl) voiceLabelEl.textContent = blindMode ? VOICE_LABEL_BLIND : VOICE_LABEL_NORMAL;
            renderAll();
            if (blindMode) speak('目隠しモードをオンにしました。音声または入力欄で指し手を入力してください。');
        });
    }

    // やねうら王 WASM エンジンを非同期ロード（COEP/COOP 環境のみ）
    if (window.crossOriginIsolated) {
        (async () => {
            try {
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = '/engine/yaneuraou.js';
                    s.onload = resolve;
                    s.onerror = () => reject(new Error('script load failed'));
                    document.head.appendChild(s);
                });
                await initWasmEngine();
            } catch (e) {
                console.warn('[WASM] ロード失敗 → JSエンジンで継続:', e.message ?? e);
            }
        })();
    }
    </script>
</body>
